name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build, audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: npm ci
      - run: uv sync --frozen
      - name: Lint and format check (ESLint, Prettier, Ruff)
        run: make lint
      - name: Type check (mypy strict)
        run: make typecheck
      - name: Unit and backend tests, content validation
        run: make test
      - name: Tutor contracts match the Pydantic models
        run: uv run python scripts/export_contracts.py --check
      - name: Build
        run: npm run build
      - name: Dependency audits
        run: |
          npm audit --audit-level=high
          uv run pip-audit --skip-editable

  smoke:
    name: Smoke test (golden path + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: npm ci
      - run: uv sync --frozen
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
