[project]
name = "hearhear"
version = "0.1.0"
description = "Tutor proxy for Hear Hear: forced-tool Claude calls, streamed over SSE."
license = "MIT"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
  "anthropic==1.11.0",
  "slowapi==0.1.10",
  "pydantic==2.13.5",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.16.10",
  "mypy==2.4.0",
  "pre-commit==4.6.2",
  "pip-audit==2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/hearhear"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["server"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"server/tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "server"
packages = ["hearhear"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
pythonpath = ["server"]
